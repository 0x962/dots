<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dots</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
	<div class="brand">dots</div>
	<select id="graph-select" class="sel" aria-label="Graph"></select>
	<button id="new-graph" class="btn ghost">New graph</button>
	<div class="path mono" id="graph-path"></div>
	<div class="spacer"></div>
	<div id="errors" class="errors" hidden></div>
	<button id="discard" class="btn ghost" disabled>Discard</button>
	<button id="save" class="btn primary" disabled>Save</button>
</header>
<main class="gb">
	<aside class="palette" id="palette">
		<span class="meta">Add a node</span>
		<div class="hint">Drag onto the canvas, then wire it: drag from a node's right port onto a container.</div>
	</aside>
	<section class="gbcanvas" id="canvas">
		<div class="zoomctl"><button id="z-out">−</button><span class="pct" id="z-pct">100%</span><button id="z-in">+</button><button id="z-fit">fit</button></div>
		<div class="gbworld" id="world">
			<svg id="edges" width="6000" height="4000"></svg>
			<div id="cards"></div>
		</div>
	</section>
	<aside class="inspector" id="inspector"></aside>
</main>
<script type="module" src="./app.ts"></script>
</body>
</html>
